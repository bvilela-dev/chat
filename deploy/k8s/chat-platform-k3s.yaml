apiVersion: v1
kind: Namespace
metadata:
  name: chat-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
  namespace: chat-platform
type: Opaque
stringData:
  # ATENÇÃO — SEGREDOS DE DEMONSTRAÇÃO.
  #
  # Estes valores existem para que `./start.sh` funcione num cluster local sem
  # configuração adicional. NUNCA use este manifesto como está em produção.
  #
  # Em produção, segredos não moram num arquivo versionado. As opções corretas
  # são: External Secrets Operator lendo de um cofre (Vault, AWS Secrets Manager,
  # Azure Key Vault), Sealed Secrets, ou a injeção por CSI driver.
  #
  # Gere uma chave adequada com:
  #   openssl rand -base64 48
  #
  # Nota: os serviços RECUSAM iniciar se esta chave for a chave de exemplo do
  # repositório (`super-secret-development-key-change-me`) fora do ambiente de
  # desenvolvimento — ver JwtAuthenticationExtensions.GuardAgainstInsecureConfiguration.
  JWT_KEY: k3s-local-demo-key-troque-antes-de-qualquer-deploy-real-0001
  POSTGRES_PASSWORD: postgres
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-config
  namespace: chat-platform
data:
  JWT_ISSUER: chat-identity
  JWT_AUDIENCE: chat-clients
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  REDIS_CONNECTION: redis:6379
  RABBITMQ_HOST: rabbitmq

  # Endereço do serviço gRPC que responde às consultas de participação em
  # conversa. É a dependência que sustenta a autorização em tempo real do chat.
  GRPC_MESSAGE_SERVICE: http://message-service:8081

  # Origens autorizadas pelo CORS no gateway. Fora de Development, a ausência
  # desta configuração faz o gateway FALHAR AO INICIAR — falhar fechado é a
  # postura correta para uma política de segurança.
  CORS_ALLOWED_ORIGINS: http://chat.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: chat-platform
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:

    processors:
      batch:

    exporters:
      debug:
        verbosity: detailed

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-identity-data
  namespace: chat-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-message-data
  namespace: chat-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: chat-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-identity
  namespace: chat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-identity
  template:
    metadata:
      labels:
        app: postgres-identity
    spec:
      containers:
        - name: postgres-identity
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: chat_identity
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-identity-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-identity
  namespace: chat-platform
spec:
  selector:
    app: postgres-identity
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-message
  namespace: chat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-message
  template:
    metadata:
      labels:
        app: postgres-message
    spec:
      containers:
        - name: postgres-message
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: chat_message
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-message-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-message
  namespace: chat-platform
spec:
  selector:
    app: postgres-message
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: chat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chat-platform
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: chat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: chat-platform
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: chat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.123.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: chat-platform
spec:
  selector:
    app: otel-collector
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: chat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: bvilela/chat-identity:latest
          imagePullPolicy: IfNotPresent
          ports:
            # REST/HTTP1, consumido pelo gateway e pelas probes.
            - name: http
              containerPort: 8080
            # gRPC/HTTP2. Porta separada porque o Kestrel não serve HTTP/1.1 e
            # HTTP/2 na mesma porta sem TLS — ver GrpcHostingExtensions.
            # Não é exposta pelo Ingress: só é alcançável dentro do cluster.
            - name: grpc
              containerPort: 8081
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__IdentityDatabase
              value: Host=postgres-identity;Port=5432;Database=chat_identity;Username=postgres;Password=$(POSTGRES_PASSWORD)
            - name: RabbitMq__Host
              valueFrom:
                configMapKeyRef:
                  name: chat-config
                  key: RABBITMQ_HOST
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: RABBITMQ_USERNAME
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: RABBITMQ_PASSWORD
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: chat-config
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: chat-config
                  key: JWT_AUDIENCE
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: JWT_KEY
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: chat-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          # -------------------------------------------------------------------
          # PROBES
          #
          # Kubernetes distingue três perguntas, e responder as três é o que
          # permite deploys sem indisponibilidade:
          #
          #   startup   → "já terminou de iniciar?" Enquanto falha, as outras
          #               duas ficam suspensas. É o que dá tempo às migrations
          #               sem que o pod seja morto por demorar a subir.
          #   readiness → "pode receber tráfego AGORA?" Ao falhar, o pod sai do
          #               balanceador mas NÃO é reiniciado.
          #   liveness  → "o processo travou?" Ao falhar, o pod é REINICIADO.
          #
          # Confundir readiness com liveness é o erro clássico: um serviço que
          # perde o banco momentaneamente seria reiniciado em laço, quando o
          # correto é apenas parar de receber tráfego até o banco voltar.
          # -------------------------------------------------------------------
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            # 30 x 5s = até 2min30 para iniciar (cobre migrations em banco frio).
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            # Tolerância maior que a readiness: reiniciar é uma ação destrutiva
            # (derruba conexões WebSocket abertas) e não deve ser disparada por
            # uma oscilação passageira.
            failureThreshold: 5
          # -------------------------------------------------------------------
          # RECURSOS
          #
          # `requests` é o que o escalonador reserva; `limits` é o teto.
          #
          # Sem `requests`, o pod entra na classe BestEffort e é o PRIMEIRO a ser
          # despejado quando o nó fica sob pressão de memória. Sem `limits`, um
          # vazamento de memória num serviço consome o nó inteiro e derruba os
          # vizinhos.
          #
          # Nota sobre limite de CPU: ao contrário da memória, ele causa
          # THROTTLING, não término do processo. Um limite apertado demais
          # aumenta a latência de cauda de forma difícil de diagnosticar — por
          # isso a folga entre request e limit aqui é generosa.
          # -------------------------------------------------------------------
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # -------------------------------------------------------------------
          # CONTEXTO DE SEGURANÇA
          #
          # Reduz o que um atacante consegue fazer caso obtenha execução de
          # código dentro do contêiner. É também o exigido pelo
          # PodSecurityStandard "restricted".
          # -------------------------------------------------------------------
          securityContext:
            # Impede que o processo ganhe privilégios além dos do usuário que o
            # iniciou (bloqueia binários setuid).
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # UID do usuário `app`, já presente nas imagens oficiais do .NET.
            runAsUser: 1654
            capabilities:
              drop: ["ALL"]
            # Sistema de arquivos somente leitura: um atacante não consegue
            # gravar um webshell nem baixar ferramentas.
            readOnlyRootFilesystem: true
          volumeMounts:
            # O .NET precisa de um diretório temporário gravável (por exemplo,
            # para a chave de proteção de dados). Um emptyDir em memória atende
            # sem abrir a raiz para escrita.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: chat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: bvilela/chat-write:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Redis
              valueFrom:
                configMapKeyRef:
                  name: chat-config
                  key: REDIS_CONNECTION
            - name: RabbitMq__Host
              valueFrom:
                configMapKeyRef:
                  name: chat-config
                  key: RABBITMQ_HOST
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: RABBITMQ_USERNAME
