              valueFrom:
                configMapKeyRef:
                  name: chat-config
                  key: GRPC_MESSAGE_SERVICE
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: chat-config
