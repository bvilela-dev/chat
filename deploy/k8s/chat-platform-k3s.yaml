            # Endereço do serviço gRPC que responde às consultas de participação
            # em conversa. É a dependência que sustenta a autorização em tempo
            # real: sem ela, a política falha FECHADA e ninguém entra em conversa
            # alguma (o que é o comportamento correto — melhor indisponível que
            # inseguro).
