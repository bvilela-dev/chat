# =============================================================================
# NGINX — serve a SPA e faz proxy das chamadas de API para o gateway.
#
# Por que existe este proxy, em vez de o navegador falar direto com o gateway:
#
#  1. MESMA ORIGEM. Todas as requisições saem para o mesmo host da página, então
#     o navegador não trata nenhuma como cross-origin. Isso elimina CORS e as
#     requisições de preflight do caminho crítico.
#
#  2. UMA IMAGEM, QUALQUER AMBIENTE. O frontend usa caminhos relativos e não
#     precisa saber o endereço do gateway. A mesma imagem Docker roda em local,
#     homologação e produção sem rebuild.
# =============================================================================

# Bloco `upstream` nomeado: concentra o endereço do gateway num único lugar.
upstream api_gateway {
    server api-gateway:8080;

    # Mantém conexões abertas com o gateway entre requisições, evitando o custo
    # de um handshake TCP a cada chamada.
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Cabeçalhos de segurança.
    # -------------------------------------------------------------------------

    # Impede que o navegador "adivinhe" o tipo do conteúdo, o que pode
    # transformar um upload de texto em script executável.
    add_header X-Content-Type-Options "nosniff" always;

    # Bloqueia o carregamento da página dentro de um iframe de outro site —
    # defesa contra clickjacking.
    add_header X-Frame-Options "DENY" always;

    # Não vaza a URL interna completa ao navegar para sites externos.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Arquivos estáticos.
    # -------------------------------------------------------------------------

    # Assets com hash no nome podem ser cacheados "para sempre": qualquer
    # alteração no conteúdo gera um nome novo, então não existe risco de servir
    # versão obsoleta. `immutable` evita até a requisição de revalidação.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # O index.html NUNCA é cacheado. Ele referencia os assets com hash; se
        # ficasse em cache, o navegador continuaria carregando a versão antiga
        # da aplicação mesmo depois de um deploy.
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # Fallback para o index.html: é o que faz o roteamento client-side da SPA
        # funcionar. Sem isso, recarregar a página em `/chat` retornaria 404,
        # porque não existe arquivo com esse nome no disco.
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Proxy das APIs REST.
    # -------------------------------------------------------------------------
    location ~ ^/(identity|messages|presence|notifications)/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        # Preserva o IP real do cliente ao longo da cadeia de proxies. É o que
        # permite ao rate limiting distinguir usuários — sem isso, todos
        # apareceriam com o IP do nginx e cairiam na mesma partição.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário para reaproveitar as conexões keepalive do upstream.
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Proxy do WebSocket (SignalR).
    # -------------------------------------------------------------------------
    location /ws/chat/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;

        # Os dois cabeçalhos abaixo são OBRIGATÓRIOS para o upgrade de HTTP para
        # WebSocket. Sem eles, o handshake do SignalR falha e o cliente cai no
        # fallback por long polling — que funciona, mas com latência bem maior e
        # muito mais tráfego.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeout longo: uma conexão WebSocket fica ociosa entre mensagens, e o
        # padrão do nginx (60 s) a encerraria durante qualquer pausa da conversa.
        # O SignalR reconectaria, mas com interrupções visíveis ao usuário.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Buffering desligado: mensagens de chat precisam ser entregues na hora,
        # não acumuladas em buffer.
        proxy_buffering off;
    }
}
